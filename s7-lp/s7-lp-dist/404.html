<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Agência S7</title>
    <meta name="description" content="A página que você procura não existe ou foi movida. Volte para o site da Agência S7.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f0f0f;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .glow {
            position: absolute;
            top: -10%; left: 50%; transform: translateX(-50%);
            width: 1200px; height: 900px;
            background: #fe0000;
            border-radius: 50%;
            filter: blur(180px);
            opacity: .35;
            pointer-events: none;
        }
        .content { position: relative; z-index: 1; padding: 24px; }
        h1 { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
        h1 span { color: #fe0000; }
        p { color: rgba(255,255,255,.6); margin: 16px 0 32px; max-width: 420px; }
        a.btn {
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 999px;
            padding: 14px 32px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #fff;
            text-decoration: none;
            transition: background .3s ease;
        }
        a.btn:hover { background: #fe0000; border-color: #fe0000; }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="content">
        <h1>404 <span>Não encontrado</span></h1>
        <p>A página que você procura não existe, foi removida ou o endereço está incorreto.</p>
        <a href="/" class="btn">Voltar para o início</a>
    </div>
</body>
</html>
